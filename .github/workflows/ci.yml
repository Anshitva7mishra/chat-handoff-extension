name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    name: Lint & Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dev dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests (shared pure functions)
        run: npm run test:shared

      - name: Unit tests (scraper fixtures)
        run: npm run test:unit

      # E2e tests are NOT run in CI — they require real browser sessions.
      # Run them locally with: npm run test:e2e
      # See README.md § End-to-end testing for setup instructions.
